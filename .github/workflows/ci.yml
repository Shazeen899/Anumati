name: Django and React checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-secret-never-use-in-production
      DJANGO_DEBUG: '1'
      DEMO_MODE: '1'
      PGDATABASE: anumati
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start native PostgreSQL and Redis (no containers)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql redis-server
          sudo systemctl start postgresql redis-server
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb anumati
      - run: pip install -r requirements.lock.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test core website --noinput -v 2
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: frontend

      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: website/frontend
